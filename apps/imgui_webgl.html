<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ImGui - Bazel + Emscripten + WebGL</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #222;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      .header {
        display: none;
      }
      .emscripten {
        padding: 0;
        margin: 0;
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
      canvas.emscripten {
        border: 0;
        background-color: #333;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 50px;
        width: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
      #status {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        text-align: center;
        z-index: 1000;
      }
      #status.error {
        color: #ff6b6b;
        background-color: #331111;
        padding: 15px;
        border-radius: 5px;
        max-width: 80vw;
      }
      #progress {
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        height: 20px;
        background-color: #555;
        border-radius: 10px;
        overflow: hidden;
        z-index: 1000;
      }
      #progress-bar {
        width: 0%;
        height: 100%;
        background-color: #3498db;
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Dear ImGui - WebGL Demo</h1>
      <p>Built with Bazel + Emscripten</p>
    </div>
    
    <div id="status">Downloading...</div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div class="spinner" id="spinner"></div>
    
    <canvas class="emscripten" id="canvas" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var progressBarElement = document.getElementById('progress-bar');
      var spinnerElement = document.getElementById('spinner');

      var Module = {
        preRun: [],
        postRun: [],
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
        },
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
          statusElement.className = 'error';
          statusElement.innerHTML = 'Error: ' + text;
          spinnerElement.style.display = 'none';
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          
          // Prevent context menu on canvas
          canvas.oncontextmenu = function(e) {
            e.preventDefault();
            return false;
          };
          
          canvas.addEventListener('contextmenu', function(e) {
            console.log('🔧 Context menu prevented!');
            e.preventDefault();
            e.stopPropagation();
            return false;
          }, true);
          
          canvas.addEventListener('mousedown', function(e) {
            if (e.button === 2) {
              e.preventDefault();
            }
          }, true);
          
          console.log('🚀 Canvas setup complete with context menu prevention');
          
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressBarElement.style.width = (parseInt(m[2])/parseInt(m[4])*100) + '%';
          } else {
            progressBarElement.style.width = '0%';
          }
          statusElement.innerHTML = text;
          
          if (text === '') {
            spinnerElement.style.display = 'none';
            progressElement.style.display = 'none';
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        },
        onRuntimeInitialized: function() {
          statusElement.innerHTML = 'Running...';
          setTimeout(function() {
            statusElement.innerHTML = '';
          }, 1000);
          console.log('✅ Runtime initialized - context menu prevention is active');
        }
      };
      
      Module.setStatus('Downloading...');
      
      window.onerror = function(message, source, lineno, colno, error) {
        var errorMsg = 'Error: ' + message;
        statusElement.className = 'error';
        statusElement.innerHTML = errorMsg;
        spinnerElement.style.display = 'none';
        progressElement.style.display = 'none';
        console.error('Error:', message);
        return true;
      };
    </script>
    <script async type="text/javascript" src="imgui_webgl_bin.js"></script>
  </body>
</html>
